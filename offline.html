<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087c45">
  <title>Jubielee Store — Offline</title>

  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      padding:
        calc(24px + env(safe-area-inset-top))
        20px
        calc(24px + env(safe-area-inset-bottom));
      place-items: center;
      background: #f3f7f4;
      color: #101915;
    }

    main {
      width: min(100%, 430px);
      padding: 30px 24px;
      border: 1px solid #dce7e0;
      border-radius: 26px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(6, 61, 34, .12);
      text-align: center;
    }

    img {
      width: 82px;
      height: 82px;
      border-radius: 22px;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 22px;
      color: #66736c;
      line-height: 1.55;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 15px;
      background: #087c45;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <img src="assets/icon-192.png"
         alt="Jubielee Store">

    <h1>You are offline</h1>

    <p>
      Reconnect to the internet to browse current products,
      inventory, payment options, and order information.
    </p>

    <button type="button"
            onclick="window.location.reload()">
      Try again
    </button>
  </main>
</body>
</html>
