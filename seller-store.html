<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seller Store | Jubielee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087c45">
  <link rel="icon" href="assets/store-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="seller.css?v=20260826-marketplace-1">
  <style>
    .public-store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.public-store-product{background:#fff;border:1px solid var(--seller-border);border-radius:16px;overflow:hidden;box-shadow:var(--seller-shadow);display:flex;flex-direction:column}.public-store-media{height:220px;background:#eef3f0;display:grid;place-items:center;overflow:hidden}.public-store-media img{width:100%;height:100%;object-fit:cover}.public-store-placeholder{font-size:54px;font-weight:900;color:var(--seller-green)}.public-store-copy{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}.public-store-copy h2{font-size:18px;margin:0}.public-store-copy p{color:var(--seller-muted);font-size:13px;margin:0;flex:1}.public-store-price{font-size:20px;font-weight:900}.public-store-stock{font-size:12px;color:var(--seller-muted)}
  </style>
</head>
<body class="seller-body">
  <header class="seller-header">
    <a class="seller-brand" href="index.html">
      <span class="seller-brand-mark">J</span>
      <span><strong>Jubielee</strong><small>Store</small></span>
    </a>
    <div class="seller-header-actions">
      <a class="seller-button secondary" href="seller.html">Seller Center</a>
      <a class="seller-button" href="index.html">JubieStore</a>
    </div>
  </header>

  <main class="seller-shell">
    <section class="seller-hero">
      <div>
        <span class="seller-eyebrow">JubieStore Seller</span>
        <h1 id="publicStoreName">Seller Store</h1>
        <p>Products sold through Jubielee with Jubielee checkout and payment options.</p>
      </div>
    </section>
    <div id="publicStoreMessage" class="seller-empty">Loading seller products…</div>
    <section id="publicStoreProducts" class="public-store-grid"></section>
  </main>

  <div id="sellerToast" class="seller-toast" hidden></div>
  <script src="config.js?v=20260826-marketplace-1"></script>
  <script src="seller-store.js?v=20260826-marketplace-1"></script>
</body>
</html>
